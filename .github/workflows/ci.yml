# Release checks. Windows is the supported platform and must pass; macOS and Linux run the same checks and are
# reported, not required, until they have been verified. The steps live in scripts/ci.mjs, which also runs locally
# (npm run ci), so the two cannot drift.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Keep the built package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: synaptome-dist
          path: dist/
