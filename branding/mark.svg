<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Synaptome">
  <!-- Two facing arcs and the point in the gap between them: a junction, not a brain. Ink ground, paper strokes, bronze point. -->
  <rect width="32" height="32" fill="#1f1d1a"/>
  <path d="M11 8a8 8 0 0 1 0 16" fill="none" stroke="#e9e4d8" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M21 8a8 8 0 0 0 0 16" fill="none" stroke="#e9e4d8" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2" fill="#c9925a"/>
</svg>
